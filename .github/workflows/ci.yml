name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gate:
    name: Full gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned tools
        run: |
          make tools
          go install github.com/zricethezav/gitleaks/v8@v8.27.2
      - name: Run the repository gate
        run: make ci
        env:
          CHANGE_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Scan for secrets
        run: gitleaks dir --no-banner --no-color --redact .
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  cross-platform:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Windows tests and build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows.ps1
      - name: Run tests
        if: runner.os != 'Windows'
        run: go test -count=1 ./...
      - name: Build CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          go build -trimpath -o vertc .
          ./vertc version
          ./vertc --help >/dev/null

  coverage:
    name: Coverage gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Enforce aggregate Go unit coverage
        run: make check-coverage COVERAGE_THRESHOLD=70.0
      - name: Retain coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-unit-coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: warn
          retention-days: 14

  template-build:
    name: Build generated web templates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Generate and build the public template
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/vertc .
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          /tmp/vertc init "$root/voice-agent" --scene voice-agent --platform web
          yarn --cwd "$root/voice-agent/web" install --frozen-lockfile --ignore-scripts
          yarn --cwd "$root/voice-agent/web" build
