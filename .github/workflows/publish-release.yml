name: Publish release

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed tag source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Resolve immutable publication identity
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          version="${GITHUB_REF_NAME#v}"
          stability=stable
          prerelease=false
          latest=true
          if [[ "$version" == *-* ]]; then
            stability=prerelease
            prerelease=true
            latest=false
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$notes_file"
          test -s "$notes_file"
          echo "VERTC_VERSION=$version" >> "$GITHUB_ENV"
          echo "VERTC_STABILITY=$stability" >> "$GITHUB_ENV"
          echo "VERTC_PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "VERTC_LATEST=$latest" >> "$GITHUB_ENV"
          echo "VERTC_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
      - name: Install pinned release tools
        run: make tools release-tools
      - name: Verify release readiness
        run: |
          make ci
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          make check-release-files
      - name: Build and verify all seven release assets
        run: |
          verified_dist="$RUNNER_TEMP/vertc-verified-dist"
          GORELEASER="$(go env GOPATH)/bin/goreleaser" \
            ./scripts/build-release-artifacts.sh \
              --stability "$VERTC_STABILITY" \
              --publication public \
              --version "$GITHUB_REF_NAME" \
              --ref "$GITHUB_SHA" \
              --output "$verified_dist"
          mapfile -t assets < <(find "$verified_dist" -maxdepth 1 -type f \
            \( -name "vertc_${VERTC_VERSION}_*.tar.gz" -o -name "vertc_${VERTC_VERSION}_*.zip" -o -name checksums.txt \))
          test "${#assets[@]}" -eq 7
          echo "VERTC_VERIFIED_DIST=$verified_dist" >> "$GITHUB_ENV"
      - name: Prepare verified npm package input
        run: |
          npm_root="$RUNNER_TEMP/vertc-npm-package"
          mkdir -p "$npm_root/artifacts" "$npm_root/scripts"
          cp package.json CHANGELOG.md LICENSE README.md README.zh-CN.md "$npm_root/"
          cp scripts/install.js scripts/run.js "$npm_root/scripts/"
          cp "$VERTC_VERIFIED_DIST"/vertc_"${VERTC_VERSION}"_*.tar.gz "$npm_root/artifacts/"
          cp "$VERTC_VERIFIED_DIST"/vertc_"${VERTC_VERSION}"_*.zip "$npm_root/artifacts/"
          cp "$VERTC_VERIFIED_DIST/checksums.txt" "$npm_root/checksums.txt"
          npm --prefix "$npm_root" version "$VERTC_VERSION" --no-git-tag-version --allow-same-version
          echo "VERTC_NPM_ROOT=$npm_root" >> "$GITHUB_ENV"
      - name: Stage draft, publish npm latest, then finalize GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ./scripts/publish-release-assets.sh \
            --tag "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --artifacts "$VERTC_VERIFIED_DIST" \
            --npm-root "$VERTC_NPM_ROOT" \
            --notes-file "$VERTC_NOTES_FILE" \
            --prerelease "$VERTC_PRERELEASE" \
            --latest "$VERTC_LATEST" \
            --npm-tag latest
      - name: Verify GitHub and npm publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/verify-release-publication.sh \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --notes-file "$VERTC_NOTES_FILE" \
            --prerelease "$VERTC_PRERELEASE" \
            --latest "$VERTC_LATEST" \
            --npm-tag latest
