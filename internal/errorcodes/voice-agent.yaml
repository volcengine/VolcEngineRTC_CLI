# 对话式 AI 运行时/OpenAPI 错误码知识库 —— voice-agent（explain-error 扩展）
#
# 错误链路及来源：
#   ① 登录凭证与 OpenAPI 请求签名 → 通用排障条目，公开文档未逐项覆盖，
#      标记为 curated-seed 且不声明 source。
#   ② RTC OpenAPI 业务调用（StartVoiceChat 等）→ 火山「公共错误码」（公开）。
#      来源：https://www.volcengine.com/docs/6348/70426
#   ③ VoiceChat 对话运行态（回调 EventType=1）→ 火山「事件和错误码」（公开）。
#      来源：https://www.volcengine.com/docs/6348/1928198（页面更新 2026-05-09）
#
# 可信状态（verified）：
#   - verified     ：转录自火山官方公开文档，已核对（②③）。
#   - curated-seed ：通用排障建议，未逐条从官方公开文档核验（①）。
# 过期治理见 scripts/error-codes-freshness.md：对照 source_version 与官方页更新日期巡检。
meta:
  platform: voice-agent
  domain: voice-agent
  verified: verified          # 文件级默认；curated-seed 条目逐条覆盖
  verified_at: "2026-07-15"
  enums: [OpenAPI, VoiceChat]

codes:
  # ========== ① 登录凭证与请求签名（通用排障条目，无逐项公开来源）==========
  - { code: SignatureDoesNotMatch, enum: OpenAPI, kind: error, verified: curated-seed,
      meaning: "OpenAPI 请求签名不匹配：访问凭证缺失、过期，或签名计算有误。",
      fix: "运行 vertc auth login 刷新访问凭证后重试；此条为通用排障建议，具体以官方文档为准。",
      doctor_check: agent.auth }
  - { code: InvalidAccessKey, enum: OpenAPI, kind: error, verified: curated-seed,
      meaning: "OpenAPI 访问凭证无效或已过期。",
      fix: "运行 vertc auth login 刷新访问凭证；此条为通用排障建议，具体以官方文档为准。",
      doctor_check: agent.auth }

  # ========== ② RTC OpenAPI 公共错误码（source: 6348/70426，公开，verified）==========
  # 仅收录与 voice-agent（StartVoiceChat/UpdateVoiceChat/StopVoiceChat）相关的常见码。
  - { code: InvalidParameter, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "参数错误。请求参数不合法（如 ASR/TTS/LLM 配置错误）。",
      fix: "根据错误提示调整参数；运行 vertc doctor 检查 agent 配置。",
      doctor_check: agent.config }
  - { code: InvalidParameter.TaskAlreadyExists, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "任务已存在：该房间已有运行中的对话任务。",
      fix: "先 vertc agent stop 再重新 start，或复用现有 TaskId。" }
  - { code: InvalidParameter.ErrorActiveTaskNotFound, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "指定任务不存在或已经停止。",
      fix: "确认 TaskId 正确，或先 vertc agent start。" }
  - { code: InvalidParameter.IllegalRoomID, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "RoomId 不合法：格式错误。",
      fix: "填写正确的房间 ID。", doctor_check: agent.config }
  - { code: InvalidParameter.BodyIsEmpty, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "请求内容为空。",
      fix: "填写请求参数。" }
  - { code: InvalidParameter.Unmarshal, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "请求解析失败：参数格式不正确。",
      fix: "填写正确的参数格式。" }
  - { code: MissingParameter.NoAppId, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "未填写 AppId。",
      fix: "补齐 rtc.app_id；运行 vertc doctor 检查配置。", doctor_check: agent.config }
  - { code: MissingParameter.NoRoomId, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "RoomId 缺失。",
      fix: "填写 RoomId。", doctor_check: agent.config }
  - { code: MissingParameter.NoUserId, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "UserId 缺失。",
      fix: "填写 UserId。", doctor_check: agent.config }
  - { code: MissingParameter.NoToken, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "Token 缺失。",
      fix: "填写 Token；可用 vertc token 生成。", doctor_check: token.valid }
  - { code: AccessDenied.ServiceNotEnabled, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "需要的服务未开通（如 ASR/TTS/LLM 依赖服务）。",
      fix: "在控制台开通所需服务后重试。", doctor_check: agent.config }
  - { code: AccessDenied.NoPermissionForApp, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "此 AccountId 没有操作该 AppId 的权限。",
      fix: "更换正确的 AccountId。", doctor_check: agent.auth }
  - { code: Unauthorized, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "操作的 AppId 与账号 ID 不匹配。",
      fix: "确认 AppId 和账号 ID 是否正确。", doctor_check: agent.auth }
  - { code: FlowLimitExceeded.QPSOverLimit, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "QPS 超过限制。",
      fix: "降低请求频率，勿太频繁发起请求。" }
  - { code: UnknownAction, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "Action 未知：不是 OpenAPI 定义的 Action。",
      fix: "检查 Action 是否为 OpenAPI 定义的接口名。" }
  - { code: UnknownVersion, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "Version 未知。",
      fix: "将 Version 重置为正确的接口版本（如 2020-12-01）。" }
  - { code: InternalError.ReachRateLimit, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "触发系统限流。",
      fix: "降低请求频率，勿太频繁发起请求。" }
  - { code: InternalError.Parallel, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "并发操作同一个任务。",
      fix: "勿并发请求同一任务。" }
  - { code: InternalError.RPC, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "rpc 调用失败，或 AppId 权限/取值错误。",
      fix: "重新发起请求，并确认 AppId 是否填写正确。", doctor_check: agent.auth }
  - { code: InternalError.Unknown, enum: OpenAPI, kind: error,
      source: "https://www.volcengine.com/docs/6348/70426",
      meaning: "系统故障，未启动成功。",
      fix: "重试；若持续请联系技术支持。" }

